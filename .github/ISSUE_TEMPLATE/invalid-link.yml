name: 失效链接反馈
description: 反馈无法访问、跳转异常或内容失效的导航条目
title: "[失效链接] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。部分网站可能受地区、网络环境、临时维护或 Cloudflare 验证影响，请尽量使用正常浏览器复核后填写。

  - type: input
    id: site-name
    attributes:
      label: 网站名称
      placeholder: 例如：示例网站
    validations:
      required: true

  - type: input
    id: site-url
    attributes:
      label: 网站地址
      description: 请填写导航卡片当前打开的网址。
      placeholder: https://example.com/
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: 所属板块
      placeholder: 例如：资源下载

  - type: dropdown
    id: problem
    attributes:
      label: 问题类型
      options:
        - 完全无法访问
        - 域名失效或停放
        - 跳转到无关内容
        - 证书或 TLS 异常
        - 内容或服务已经停止
        - 其他问题
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 具体表现
      description: 可填写浏览器提示、HTTP 状态、所在地区或使用的网络环境，请勿提交账号、Token、Cookie 等敏感信息。
      placeholder: 请描述实际看到的问题。
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: 人工确认
      options:
        - label: 我已使用正常浏览器重新访问，并确认不是一次性的网络波动。
          required: true
        - label: 我没有在反馈中填写密码、Token、Cookie 或其他敏感信息。
          required: true
