name: Navigation link health report

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * 1"

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate link health report
        run: python tools/check_links.py --output link-health-report.md

      - name: Add report to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f link-health-report.md ]]; then
            cat link-health-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "链接健康报告未生成，请查看前序步骤日志。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload link health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-link-health-report
          path: link-health-report.md
          if-no-files-found: warn
          retention-days: 30
