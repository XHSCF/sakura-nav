name: Validate navigation site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check Python syntax
        run: python -m py_compile tools/validate_site.py tools/validate_admin.py tools/check_links.py

      - name: Check JavaScript syntax
        run: node --check assets/js/theme-init.js && node --check assets/js/data-loader.js && node --check assets/js/analytics.js && node --check assets/js/app-guard.js && node --check assets/js/sakura-core.js && node --check assets/js/sakura-app.js && node --check admin/admin-core.js && node --check admin/admin.js && node --check worker/index.mjs

      - name: Run frontend regression tests
        run: node --test tools/test_frontend.js

      - name: Run backend regression tests
        run: |
          node --test tools/test_admin_ui.js
          node --test tools/test_worker.js

      - name: Validate site structure and data
        run: python tools/validate_site.py

      - name: Validate D1 schema and admin assets
        run: python tools/validate_admin.py
